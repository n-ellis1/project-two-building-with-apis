{% extends "games/base.html" %}
{% block title %}Edit {{ game.name }}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6">
    <h1 class="h3 mb-3">Edit {{ game.name }}</h1>
    <form method="post" action="{% url 'games:entry_edit' entry.pk %}" novalidate>
      {% csrf_token %}
      {% include "games/_form_fields.html" %}
      <div class="d-flex flex-wrap gap-2">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a href="{% url 'games:entry_detail' entry.pk %}" class="btn btn-outline-secondary" data-testid="cancel-edit">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
